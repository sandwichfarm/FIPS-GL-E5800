- name: Transactional FIPS stack deployment with router-local rollback
  hosts: routers
  gather_facts: false
  serial: 1
  vars_files:
    - vars/defaults.yml
  pre_tasks:
    - name: Prevent check-only fixtures from authorizing deployment
      ansible.builtin.assert:
        that: ansible_check_mode
      when: check_only_fixture | default(false) | bool

  roles:
    - preflight

  tasks:
    - name: Refuse deployment over pending router network configuration edits
      ansible.builtin.raw: |
        set -eu
        command -v uci >/dev/null
        for name in network dhcp firewall; do
          changes=$(uci -q changes "$name")
          if [ -n "$changes" ]; then
            echo "Pending UCI changes in $name; commit or revert them before deployment" >&2
            exit 1
          fi
        done
      changed_when: false
      check_mode: false

    - name: Require reviewed components, firmware and a unique transaction
      ansible.builtin.assert:
        that:
          - restore_components | length > 0
          - restore_components | unique | list | length == restore_components | length
          - restore_components | difference(['fips', 'web_ui', 'device_ui']) | length == 0
          - router_profile in approved_profiles
          - recovery_transaction is defined
          - recovery_transaction is match('^[A-Za-z0-9_-]+$')
          - recovery_seconds | int >= 60
          - recovery_seconds | int <= 900
          - recovery_min_root_kib | int >= 131072
          - recovery_min_tmp_kib | int >= 131072
          - recovery_probe_ip is defined
          - recovery_probe_ip is match('^[0-9.]+$')
          - recovery_probe_name is defined
          - recovery_probe_name is match('^[A-Za-z0-9.-]+$')
          - recovery_probe_ipv6 is not defined or (recovery_probe_ipv6 is match('^[0-9A-Fa-f:.]+$') and ':' in recovery_probe_ipv6)
          - fips_required_link_count | default(1) | int >= 1
          - known_good_artifacts.keys() | list | difference(['fips', 'web_ui', 'device_ui']) | length == 0
        fail_msg: Supply reviewed firmware, selected artifacts, unique rollback transaction, and reachable network probes.

    - name: Require a public IPv6 connectivity probe when supplied
      ansible.builtin.command:
        argv:
          - "{{ controller_python }}"
          - -c
          - "import ipaddress, sys; assert ipaddress.IPv6Address(sys.argv[1]).is_global"
          - "{{ recovery_probe_ipv6 }}"
      delegate_to: localhost
      check_mode: false
      changed_when: false
      when: recovery_probe_ipv6 is defined

    - name: Validate every selected candidate before router writes
      ansible.builtin.include_role:
        name: package_validate
      loop: "{{ restore_components }}"
      loop_control:
        loop_var: stack_component

    - name: Validate pinned offline dashboard runtime before router writes
      ansible.builtin.command:
        argv:
          - "{{ controller_python }}"
          - "{{ playbook_dir }}/../tools/offline_runtime.py"
          - verify
          - --root
          - "{{ playbook_dir }}/.."
      delegate_to: localhost
      check_mode: false
      changed_when: false
      when: "'device_ui' in restore_components"

    - name: Validate all supplied known-good IPKs before router writes
      ansible.builtin.command:
        argv:
          - "{{ controller_python }}"
          - "{{ playbook_dir }}/../tools/ipk.py"
          - "{{ item.value.path }}"
          - --sha256
          - "{{ item.value.sha256 }}"
          - --component
          - "{{ item.key }}"
        chdir: "{{ playbook_dir }}/.."
      loop: "{{ known_good_artifacts | dict2items }}"
      delegate_to: localhost
      check_mode: false
      changed_when: false

    - name: Require reviewed initial FIPS settings to enable the node
      ansible.builtin.assert:
        that:
          - "'fips' in restore_components"
          - initial_fips_settings is mapping
          - initial_fips_settings.enabled | default(false) | bool
          - initial_fips_settings.peers | default([]) | length > 0
        fail_msg: Initial FIPS settings must be a reviewed, enabled router-node configuration.
      when: initial_fips_settings is defined

    - name: Require a reviewed recovery backup for identity restoration
      ansible.builtin.assert:
        that:
          - "'fips' in restore_components"
          - initial_fips_settings is not defined
          - recovery_backup is mapping
          - recovery_backup.path is defined
          - recovery_backup.identity is defined
        fail_msg: Restore an existing FIPS identity only with its reviewed encrypted backup and age identity.
      when: recovery_backup is defined

    - name: Require public IPv6 probe for initial LAN gateway deployment
      ansible.builtin.assert:
        that: recovery_probe_ipv6 is defined
        fail_msg: Gateway mode requires a reviewed public IPv6 connectivity probe.
      when:
        - initial_fips_settings is defined
        - initial_fips_settings.gateway_enabled | default(false) | bool

    - name: Decrypt and validate recovery backup on the controller before router writes
      ansible.builtin.command:
        argv:
          - "{{ controller_python }}"
          - "{{ playbook_dir }}/../tools/backup_bundle.py"
          - "{{ recovery_backup.path }}"
          - --identity
          - "{{ recovery_backup.identity }}"
          - --require-fips-identity
          - --require-enabled-fips
          - --gateway-probe-ipv6
          - "{{ recovery_probe_ipv6 | default('') }}"
        chdir: "{{ playbook_dir }}/.."
      delegate_to: localhost
      check_mode: false
      changed_when: false
      no_log: true
      when: recovery_backup is defined

    - name: Check package and hardware prerequisites
      ansible.builtin.include_role:
        name: prerequisites

    - name: Classify a prior recovery guard before router writes
      ansible.builtin.raw: |
        set -eu
        if [ -e /etc/fips-recovery/guard.sh ] || [ -L /etc/fips-recovery/guard.sh ]; then
          for name in guard.sh health.sh probes.json apply-initial.sh runtime-packages; do
            test -f "/etc/fips-recovery/$name"
            test ! -L "/etc/fips-recovery/$name"
          done
          test -f /etc/init.d/fips-recovery
          test ! -L /etc/init.d/fips-recovery
          test "$(stat -c %a /etc/fips-recovery)" = 700
          test ! -e /etc/fips-recovery/{{ recovery_transaction }}
          test ! -L /etc/fips-recovery/{{ recovery_transaction }}
          for path in /etc/fips-recovery/*.tmp /etc/fips-recovery/.cleanup-* /etc/init.d/fips-recovery.tmp; do
            test ! -e "$path" && test ! -L "$path"
          done
          grep -qx '# FIPS_RECOVERY_LAYOUT=2' /etc/fips-recovery/guard.sh
          test ! -e /etc/fips-recovery/pending
          test "$(/bin/sh /etc/fips-recovery/guard.sh status)" = NONE
          /etc/init.d/fips-recovery enabled >/dev/null
          /etc/init.d/fips-recovery status >/dev/null
          {% if 'device_ui' in restore_components %}
          while IFS= read -r package; do
            grep -Fxq "$package" /etc/fips-recovery/runtime-packages || {
              echo "Existing guard does not cover candidate runtime package: $package" >&2
              exit 1
            }
          done <<'FIPS_CANDIDATE_RUNTIME'
        {{ ((lookup('file', playbook_dir + '/../upstream/vendor/runtime.json') | from_json).remove_order | join('\n')) }}
        FIPS_CANDIDATE_RUNTIME
          {% endif %}
          echo GUARDED_UPGRADE
        else
          test ! -e /etc/fips-recovery
          test ! -L /etc/fips-recovery
          test ! -e /etc/init.d/fips-recovery
          test ! -L /etc/init.d/fips-recovery
          for package in fips gl-sdk4-ui-fips gl-e5800-dashboard; do
            if opkg status "$package" 2>/dev/null | grep -q '^Package:'; then
              echo "An installed FIPS component has no rollback guard: $package" >&2
              exit 1
            fi
          done
          echo FIRST_INSTALL
        fi
      register: guard_install_state
      changed_when: false
      check_mode: false

    - name: Record guard installation path
      ansible.builtin.set_fact:
        existing_recovery_guard: "{{ 'GUARDED_UPGRADE' in guard_install_state.stdout }}"

    - name: Require a private off-router backup destination before router writes
      ansible.builtin.assert:
        that:
          - predeploy_backup is defined
          - predeploy_backup is mapping
          - predeploy_backup.recipient | default('') is match('^age1[0-9a-z]+$')
          - predeploy_backup.identity | default('') is match('^/')
          - predeploy_backup.directory | default('') is match('^/')
        fail_msg: Set a private age recipient, identity and absolute backup directory before deployment.
      when: not ansible_check_mode

    - name: Read the current router configuration into an encrypted controller backup
      when: not ansible_check_mode
      block:
        - name: Capture all UCI configuration, FIPS identity and dashboard settings
          ansible.builtin.raw: |
            set -eu
            umask 077
            command -v openssl >/dev/null
            archive=$(mktemp /tmp/fips-predeploy.XXXXXX)
            trap 'rm -f "$archive"' EXIT
            set -- etc/config
            if [ -d /etc/fips ]; then
              identity_present=1
              set -- "$@" etc/fips
            else
              identity_present=0
            fi
            if [ -f /root/dashboard/config.json ]; then
              set -- "$@" root/dashboard/config.json
            fi
            if [ -f /etc/fips-recovery/guard.sh ]; then
              for name in guard.sh health.sh probes.json apply-initial.sh runtime-packages; do
                test -f "/etc/fips-recovery/$name" && test ! -L "/etc/fips-recovery/$name"
                set -- "$@" "etc/fips-recovery/$name"
              done
              test -f /etc/init.d/fips-recovery && test ! -L /etc/init.d/fips-recovery
              set -- "$@" etc/init.d/fips-recovery
            fi
            tar -czf "$archive" -C / "$@"
            tar -tzf "$archive" >/dev/null
            printf 'FIPS_PRESENT=%s\n' "$identity_present"
            openssl base64 -A -in "$archive"
            printf '\n'
          register: predeploy_capture
          changed_when: false
          no_log: true

        - name: Encrypt and verify the off-router backup before any persistent write
          ansible.builtin.command:
            argv:
              - "{{ controller_python }}"
              - "{{ playbook_dir }}/../tools/capture_backup.py"
              - --from-stdin
              - --recipient
              - "{{ predeploy_backup.recipient }}"
              - --identity
              - "{{ predeploy_backup.identity }}"
              - --output
              - "{{ predeploy_backup.directory }}/{{ recovery_transaction }}.age"
            stdin: "{{ predeploy_capture.stdout }}"
          delegate_to: localhost
          check_mode: false
          changed_when: true
          no_log: true

    - name: Show dry-run transaction plan
      ansible.builtin.debug:
        msg: "Would install {{ restore_components | join(', ') }} with rollback transaction {{ recovery_transaction }}; no router writes in check mode."
      when: ansible_check_mode

    - name: Install with a router-local rollback guard
      when: not ansible_check_mode
      block:
        - name: Stage exact prior packages before changing an existing guard
          ansible.builtin.include_tasks: stage_previous.yml
          loop: "{{ known_good_artifacts | dict2items }}"
          loop_control:
            loop_var: prior_component
          when: existing_recovery_guard

        - name: Arm the existing guard before replacing its files
          ansible.builtin.raw: >-
            /bin/sh /etc/fips-recovery/guard.sh arm
            {{ recovery_transaction | quote }} {{ recovery_seconds | int }}
          register: prior_recovery_arm
          changed_when: "'ARMED ' in prior_recovery_arm.stdout"
          when: existing_recovery_guard

        - name: Install and start boot-persistent recovery guard
          ansible.builtin.raw: |
            set -eu
            {% if existing_recovery_guard %}
            test -f /etc/fips-recovery/pending
            read -r pending_id _ < /etc/fips-recovery/pending
            test "$pending_id" = {{ recovery_transaction | quote }}
            {% else %}
            test ! -e /etc/fips-recovery/pending
            {% endif %}
            umask 077
            mkdir -p /etc/fips-recovery
            chmod 0700 /etc/fips-recovery
            decode() { if command -v base64 >/dev/null 2>&1; then base64 -d; else openssl base64 -d; fi; }
            decode > /etc/fips-recovery/guard.sh.tmp <<'FIPS_GUARD_PAYLOAD'
            {{ lookup('file', playbook_dir + '/../packaging/recovery/guard.sh') | b64encode }}
            FIPS_GUARD_PAYLOAD
            /bin/sh -n /etc/fips-recovery/guard.sh.tmp
            mv /etc/fips-recovery/guard.sh.tmp /etc/fips-recovery/guard.sh
            chmod 0700 /etc/fips-recovery/guard.sh
            decode > /etc/fips-recovery/health.sh.tmp <<'FIPS_HEALTH_PAYLOAD'
            {{ lookup('file', playbook_dir + '/../packaging/recovery/health.sh') | b64encode }}
            FIPS_HEALTH_PAYLOAD
            /bin/sh -n /etc/fips-recovery/health.sh.tmp
            mv /etc/fips-recovery/health.sh.tmp /etc/fips-recovery/health.sh
            chmod 0700 /etc/fips-recovery/health.sh
            decode > /etc/fips-recovery/probes.json.tmp <<'FIPS_PROBES'
            {{ {'ip': recovery_probe_ip, 'name': recovery_probe_name, 'minimum_links': fips_required_link_count | default(1) | int, 'ipv6': recovery_probe_ipv6 | default(none), 'components': restore_components | unique | sort | join(',')} | to_json | b64encode }}
            FIPS_PROBES
            mv /etc/fips-recovery/probes.json.tmp /etc/fips-recovery/probes.json
            chmod 0600 /etc/fips-recovery/probes.json
            decode > /etc/fips-recovery/apply-initial.sh.tmp <<'FIPS_INITIAL_SCRIPT'
            {{ lookup('file', playbook_dir + '/../packaging/recovery/apply-initial.sh') | b64encode }}
            FIPS_INITIAL_SCRIPT
            /bin/sh -n /etc/fips-recovery/apply-initial.sh.tmp
            mv /etc/fips-recovery/apply-initial.sh.tmp /etc/fips-recovery/apply-initial.sh
            chmod 0700 /etc/fips-recovery/apply-initial.sh
            {% if 'device_ui' in restore_components %}
            decode > /etc/fips-recovery/runtime-packages.tmp <<'FIPS_RUNTIME_PACKAGES'
            {{ (((lookup('file', playbook_dir + '/../upstream/vendor/runtime.json') | from_json).remove_order | join('\n')) ~ '\n') | b64encode }}
            FIPS_RUNTIME_PACKAGES
            {% else %}
            : > /etc/fips-recovery/runtime-packages.tmp
            {% endif %}
            mv /etc/fips-recovery/runtime-packages.tmp /etc/fips-recovery/runtime-packages
            chmod 0600 /etc/fips-recovery/runtime-packages
            decode > /etc/init.d/fips-recovery.tmp <<'FIPS_INIT_PAYLOAD'
            {{ lookup('file', playbook_dir + '/../packaging/recovery/fips-recovery.init') | b64encode }}
            FIPS_INIT_PAYLOAD
            /bin/sh -n /etc/init.d/fips-recovery.tmp
            mv /etc/init.d/fips-recovery.tmp /etc/init.d/fips-recovery
            chmod 0755 /etc/init.d/fips-recovery
            {% if not existing_recovery_guard %}
            /etc/init.d/fips-recovery enable
            /etc/init.d/fips-recovery restart
            {% else %}
            # Keep the old watchdog process alive through the upgrade deadline.
            /etc/init.d/fips-recovery enabled
            {% endif %}
            /etc/init.d/fips-recovery status
          changed_when: true

        - name: Stage exact prior packages for a first installation
          ansible.builtin.include_tasks: stage_previous.yml
          loop: "{{ known_good_artifacts | dict2items }}"
          loop_control:
            loop_var: prior_component
          when: not existing_recovery_guard

        - name: Arm new local guard before any candidate package installation
          ansible.builtin.raw: >-
            /bin/sh /etc/fips-recovery/guard.sh arm
            {{ recovery_transaction | quote }} {{ recovery_seconds | int }}
          register: recovery_arm
          changed_when: "'ARMED ' in recovery_arm.stdout"
          when: not existing_recovery_guard

        - name: Install pinned offline dashboard runtime inside the rollback window
          ansible.builtin.include_role:
            name: offline_runtime
          when: "'device_ui' in restore_components"

        - name: Install selected packages within the rollback window
          ansible.builtin.include_role:
            name: package_restore
          loop: "{{ restore_components }}"
          loop_control:
            loop_var: stack_component

        - name: Restore identity and configuration from the encrypted backup under the rollback guard
          when: recovery_backup is defined
          block:
            - name: Allocate private controller restore staging
              ansible.builtin.tempfile:
                state: directory
                prefix: e5800-restore-
              delegate_to: localhost
              register: identity_restore_stage
              no_log: true

            - name: Render guarded restore script on the controller
              ansible.builtin.command:
                argv: "{{ [controller_python, playbook_dir + '/../tools/render_backup_restore.py', recovery_backup.path, '--identity', recovery_backup.identity, '--transaction', recovery_transaction, '--output', identity_restore_stage.path + '/restore.sh'] + (['--restore-dashboard'] if 'device_ui' in restore_components else []) }}"
                chdir: "{{ playbook_dir }}/.."
              delegate_to: localhost
              changed_when: false
              no_log: true

            - name: Apply backed-up FIPS files on the router
              ansible.builtin.script:
                cmd: "{{ identity_restore_stage.path }}/restore.sh"
                executable: /bin/sh
              register: identity_restore_result
              changed_when: "'FIPS_BACKUP_CHANGED' in identity_restore_result.stdout"
              failed_when: "'FIPS_BACKUP_RESTORED' not in identity_restore_result.stdout"
              no_log: true
          always:
            - name: Delete private controller restore staging
              ansible.builtin.file:
                path: "{{ identity_restore_stage.path }}"
                state: absent
              delegate_to: localhost
              when: identity_restore_stage is defined and identity_restore_stage.path is defined
              no_log: true

        - name: Apply reviewed initial FIPS settings inside the package rollback window
          ansible.builtin.raw: |
            set -eu
            decode() { if command -v base64 >/dev/null 2>&1; then base64 -d; else openssl base64 -d; fi; }
            decode <<'FIPS_INITIAL_SETTINGS' | /bin/sh /etc/fips-recovery/apply-initial.sh {{ recovery_transaction | quote }}
            {{ initial_fips_settings | to_json | b64encode }}
            FIPS_INITIAL_SETTINGS
          register: initial_fips_apply
          changed_when: "'FIPS_CONFIG_APPLIED' in initial_fips_apply.stdout"
          no_log: true
          when: initial_fips_settings is defined

        - name: Start the selected touchscreen dashboard inside the rollback window
          ansible.builtin.raw: |
            set -eu
            test -x /root/dashboard/toggle.sh
            /etc/init.d/homebutton enable
            /etc/init.d/homebutton start
            /root/dashboard/toggle.sh on
            /etc/init.d/citydash status >/dev/null
            echo DEVICE_UI_ACTIVE
          register: device_ui_activation
          changed_when: "'DEVICE_UI_ACTIVE' in device_ui_activation.stdout"
          when: "'device_ui' in restore_components"

        - name: Check management, ordinary networking and package runtime
          ansible.builtin.raw: >-
            /bin/sh /etc/fips-recovery/health.sh
            {{ recovery_probe_ip | quote }} {{ recovery_probe_name | quote }}
            {{ restore_components | join(',') | quote }}
            {{ fips_required_link_count | default(1) | int }}
            {{ recovery_probe_ipv6 | default('') | quote }}
          register: deployment_health
          changed_when: false
          until: "'FIPS_HEALTHY' in deployment_health.stdout"
          retries: 6
          delay: 5

        - name: Leave transaction pending for independent interface checks
          ansible.builtin.debug:
            msg: >-
              Packages passed automated checks but remain under the router-local
              rollback deadline. Verify the web and touchscreen interfaces,
              then run ansible/confirm.yml with interface_health_verified=true
              before the {{ recovery_seconds }}-second deadline. Otherwise the
              router rolls back automatically.

      rescue:
        - name: Roll back immediately after a failed local deployment step
          ansible.builtin.raw: |
            set -eu
            if /bin/sh /etc/fips-recovery/guard.sh rollback; then
              exit 0
            fi
            {% if existing_recovery_guard %}
            /bin/sh /etc/fips-recovery/{{ recovery_transaction }}/backup/guard-files/guard.sh rollback
            {% else %}
            exit 1
            {% endif %}
          when: >-
            (prior_recovery_arm is defined and 'ARMED ' in prior_recovery_arm.stdout | default('')) or
            (recovery_arm is defined and 'ARMED ' in recovery_arm.stdout | default(''))
          ignore_errors: true

        - name: Remove incomplete first-install guard before any package change
          ansible.builtin.raw: |
            set -eu
            test ! -e /etc/fips-recovery/pending
            for package in fips gl-sdk4-ui-fips gl-e5800-dashboard; do
              ! opkg status "$package" 2>/dev/null | grep -q '^Package:'
            done
            if [ -x /etc/init.d/fips-recovery ]; then
              /etc/init.d/fips-recovery disable || true
              /etc/init.d/fips-recovery stop || true
            fi
            for link in /etc/rc.d/*fips-recovery; do
              if [ -e "$link" ] || [ -L "$link" ]; then rm -f "$link"; fi
            done
            rm -f /etc/init.d/fips-recovery /etc/init.d/fips-recovery.tmp
            rm -rf /etc/fips-recovery /tmp/fips-recovery
            sync
            echo FIRST_INSTALL_BOOTSTRAP_CLEAN
          when:
            - not existing_recovery_guard
            - recovery_arm is not defined or 'ARMED ' not in recovery_arm.stdout | default('')
          ignore_errors: true

        - name: Remove prior-package staging after an unarmed upgrade failure
          ansible.builtin.raw: |
            set -eu
            test ! -e /etc/fips-recovery/pending
            test ! -e /etc/fips-recovery/{{ recovery_transaction }}/result
            rm -rf /etc/fips-recovery/{{ recovery_transaction }}
            echo PRIOR_STAGING_CLEAN
          when:
            - existing_recovery_guard
            - prior_recovery_arm is not defined or 'ARMED ' not in prior_recovery_arm.stdout | default('')
          ignore_errors: true

        - name: Report failed deployment and autonomous rollback status
          ansible.builtin.fail:
            msg: Deployment failed. Check /etc/fips-recovery/{{ recovery_transaction }}/result on the router; its watchdog rolls back after the deadline or reboot if SSH was lost.
