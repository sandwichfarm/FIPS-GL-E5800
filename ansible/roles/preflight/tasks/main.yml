- name: Read firmware and runtime fingerprints (no Python needed)
  ansible.builtin.raw: |
    set -eu
    test -r /etc/glversion
    command -v opkg >/dev/null
    command -v sha256sum >/dev/null
    command -v base64 >/dev/null 2>&1 || command -v openssl >/dev/null
    ubus call system board | jsonfilter -e '@.model'
    cat /etc/glversion
    . /etc/openwrt_release
    printf '%s\n' "$DISTRIB_ARCH"
    set -- /www/js/app.*.js.gz
    test "$#" = 1
    sha256sum "$1" | cut -d ' ' -f 1
    sha256sum /usr/bin/gl_screen | cut -d ' ' -f 1
  register: router_probe
  changed_when: false
  check_mode: false

- name: Check expected platform
  ansible.builtin.assert:
    that:
      - router_probe.stdout_lines | length == 5
      - "'E5800' in router_probe.stdout_lines[0]"
      - router_probe.stdout_lines[2] == 'aarch64_cortex-a53'

- name: Record observed profile
  ansible.builtin.set_fact:
    router_profile:
      firmware: "{{ router_probe.stdout_lines[1] }}"
      architecture: "{{ router_probe.stdout_lines[2] }}"
      app_sha256: "{{ router_probe.stdout_lines[3] }}"
      screen_sha256: "{{ router_probe.stdout_lines[4] }}"

- name: Show observed profile
  ansible.builtin.debug:
    var: router_profile
