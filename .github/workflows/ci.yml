name: GL-E5800 local stack CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject tracked private state and obvious secrets
        run: python3 tools/secret_scan.py
      - name: Install Ansible and age for recovery tests
        run: sudo apt-get update && sudo apt-get install -y ansible age python3-pil python3-numpy
      - name: Build pinned Rust and Zig environment
        run: make dev-image
      - name: Install locked web dependencies and validate UI
        run: make web-deps web-build web-test web-browser-test
      - name: Fetch checksum-pinned offline dashboard runtime
        run: make vendor-deps
      - name: Validate Python and Ansible logic
        run: make check
      - name: Check Rust formatting and static analysis
        run: make rust-check
      - name: Test shared FIPS management backend
        run: make rust-test
      - name: Build and test native multi-node lab
        run: make lab-build lab-up lab-test
      - name: Keep router IPv6 policy while starting the mesh TUN
        run: make scoped-ipv6-test
      - name: Exercise route advertisement on isolated Linux LAN
        run: make route-lan-test
        env:
          FIPS_RA_REQUIRE_ROUTE_INFO: "1"
      - name: Exercise web panel against live lab backend
        run: make web-live-browser-test
      - name: Stop lab
        if: always()
        run: make lab-down
      - name: Cross-build all OpenWrt ARM64 binaries
        run: make openwrt-build
      - name: Build deterministic candidate packages
        run: make package-fips package-web package-device
      - name: Inspect package digests and metadata
        run: python3 tools/verify_artifacts.py
      - name: Emit compatibility manifest and checksums
        run: python3 tools/compatibility_manifest.py
      - name: Audit locked dependency checksums and licenses
        run: make dependency-audit
      - name: Exercise offline recovery kit
        run: python3 dev/lab/kit_smoke.py
      - name: Exercise post-firmware identity recovery kit
        run: python3 dev/lab/kit_smoke.py --restore-identity
      - name: Upload candidate artifacts and provenance
        uses: actions/upload-artifact@v4
        with:
          name: gl-e5800-candidates-${{ github.sha }}
          path: |
            artifacts/*.ipk
            artifacts/*.ipk.json
            artifacts/runtime.json
            artifacts/runtime/*.ipk
            artifacts/compatibility.json
            artifacts/checksums.sha256
            artifacts/dependencies.json
          if-no-files-found: error
          retention-days: 30
